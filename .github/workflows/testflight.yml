name: Upload PapuPay to TestFlight
run-name: TestFlight build ${{ github.run_number }}.${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      distribute_internal:
        type: boolean
        description: Verify the Sweeto App Clip invocations and distribute to the PapuPay Demo internal group
        default: false

  push:
    branches: [main]
    paths: ['.github/workflows/testflight.yml']

permissions:
  contents: read

concurrency:
  group: papupay-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: >-
      github.repository == 'Ahmad-Alaziz/PapuPay' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.actor == github.repository_owner &&
        github.event.before == '34b085160095aa5b72b30358613e65177a0acb85' &&
        github.event.head_commit.message == 'Publish the Sweeto Wallet card and corrected dashboard'))
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    environment: apple-signing
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Set up Node for the signed demo pass template
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Install pinned signing tools
        run: |
          python -m pip install --disable-pip-version-check codemagic-cli-tools==0.70.0
          gem install xcodeproj -v 1.27.0 --no-document --user-install
      - name: Verify private demo resource handling
        run: |
          python3 scripts/ci/test-guest-demo.py
          swiftc apps/ios/Shared/VenueDemoLoyalty.swift scripts/test-demo-loyalty.swift -o "$RUNNER_TEMP/demo-loyalty-tests"
          "$RUNNER_TEMP/demo-loyalty-tests"
      - name: Sign, archive and export the TestFlight IPA
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          PAPUPAY_GUEST_DEMO_BASE64: ${{ secrets.PAPUPAY_GUEST_DEMO_BASE64 }}
        run: bash scripts/ci/export-testflight.sh
      - name: Upload the IPA through the App Store Connect API
        uses: Apple-Actions/upload-testflight-build@665328adbecbc3ad929d3da710696d928b8a7ba9 # v5.9.0
        with:
          backend: appstore-api
          app-path: build/export/PapuPay.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          wait-for-processing: 'false'
      - name: Distribute to the PapuPay Demo internal group
        if: github.event_name == 'push' || inputs.distribute_internal
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/ci/distribute-testflight.py "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
      - name: Keep non-secret packaging reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-packaging-${{ github.run_id }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
